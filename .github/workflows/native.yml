name: Build APK and EXE
on:
  push:
    paths: ['native/**', '.github/workflows/native.yml', 'public/icons/icon-192.png']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Assemble test APK
        working-directory: native/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK signature
        run: $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose native/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Name APK
        run: cp native/android/app/build/outputs/apk/debug/app-debug.apk Limochat-Android-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Limochat-Android-APK
          path: Limochat-Android-test.apk
          retention-days: 30
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Windows icon
        run: |
          python -m pip install pillow
          python -c "from PIL import Image; Image.open('public/icons/icon-192.png').resize((256,256)).save('native/desktop/icon.ico',sizes=[(16,16),(32,32),(48,48),(128,128),(256,256)])"
      - name: Install desktop dependencies
        working-directory: native/desktop
        run: npm install --no-audit --no-fund
      - name: Smoke test isolated desktop window
        working-directory: native/desktop
        run: npx electron . --smoke
      - name: Build Windows installer
        working-directory: native/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Limochat-Windows-EXE
          path: native/desktop/dist/*.exe
          retention-days: 30
